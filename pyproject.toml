[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "evoforestmem"
version = "0.1.0"
description = "Evidence-guided adaptive memory for streaming multi-party conversations"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = ["numpy>=1.24", "PyYAML>=6", "python-dotenv>=1", "openai>=1.30"]
[project.optional-dependencies]
dense = ["torch>=2.2", "sentence-transformers>=3", "transformers>=4.40", "tokenizers>=0.21", "jinja2>=3.1"]
[project.scripts]
evoforestmem = "evoforestmem.cli:main"
[tool.setuptools.packages.find]
include = ["evoforestmem*"]
[tool.setuptools.package-data]
evoforestmem = ["config/*.yaml", "config/*.json"]
